      // Pomodoro countdown effect
      useEffect(() => {
        let interval = null;
        if (timerRunning && timerSeconds > 0) {
          interval = setInterval(() => {
            setTimerSeconds(s => s - 1);
          }, 1000);
        } else if (timerSeconds === 0) {
          setTimerRunning(false);
          const nextMode = timerMode === 'focus' ? 'break' : 'focus';
          setTimerMode(nextMode);
          setTimerSeconds(nextMode === 'focus' ? 25 * 60 : 5 * 60);
          addNotification(
            timerMode === 'focus' ? 'Focus session completed! Take a 5-minute break.' : 'Break finished! Ready for next focus block?',
            'success'
          );
        }
        return () => clearInterval(interval);
      }, [timerRunning, timerSeconds, timerMode]);

      // Toast notification helper
      const showToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));

      // Persistent App Notification helper
      const addNotification = (title, type = 'info') => {

          time: 'Just now',
          type,
          read: false
        };

      const unreadCount = useMemo(() => notifications.filter(n => !n.read).length, [notifications]);

      // Log study hours helper

      // ─────────────────────────────────────────────────────────────────────────────
      // Study Plan Generator with Unavailability Handling
      // ─────────────────────────────────────────────────────────────────────────────
      const generateStudyPlan = (currentTasks, currentPrefs, unavailableOffsetDays = 0) => {
        const upcoming = currentTasks.filter(t => t.status !== 'Completed');
        upcoming.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

        const hoursAvailable = currentPrefs.studyHoursPerWeek || 15;

        const weeks = [
          { weekNum: 1, dateRange: 'Nov 02 - Nov 08, 2026', focus: 'Catch up on readings & initial problem sets' },
          { weekNum: 2, dateRange: 'Nov 09 - Nov 15, 2026', focus: 'Midterm exam review & project milestone 1' },
          { weekNum: 3, dateRange: 'Nov 16 - Nov 22, 2026', focus: 'Essay drafting & analytical problem sets' },
          { weekNum: 4, dateRange: 'Nov 23 - Nov 29, 2026', focus: 'Study group review sessions & early final prep' },
          { weekNum: 5, dateRange: 'Nov 30 - Dec 06, 2026', focus: 'Intensive final projects & code submissions' },
          { weekNum: 6, dateRange: 'Dec 07 - Dec 20, 2026', focus: 'Final comprehensive exams marathon' },
        ];

        const generated = weeks.map((w, idx) => {
          const weekTasks = upcoming.slice(idx * 2, (idx * 2) + 2);

          if (unavailableOffsetDays > 0 && idx === 0) {
            return {
              ...w,
              status: 'Adjusted for Unavailability',
              note: `Adjusted: Reduced study hours this week by ${unavailableOffsetDays} days off. Workload shifted to subsequent weeks.`,
              allocatedHours: Math.max(4, hoursAvailable - (unavailableOffsetDays * 3)),
              tasks: weekTasks
            };
          }

          return {
            ...w,
            status: 'Balanced',
            allocatedHours: hoursAvailable,
            tasks: weekTasks.length > 0 ? weekTasks : (upcoming[idx % upcoming.length] ? [upcoming[idx % upcoming.length]] : [])
          };
        });

        setStudyPlan(generated);
      };

      // ─────────────────────────────────────────────────────────────────────────────
      // AI Extraction Workflow
      // ─────────────────────────────────────────────────────────────────────────────
      const handleAIExtraction = async (sourceText, fileName, fileBlob = null) => {
        setIsExtracting(true);
        setExtractionProgress(20);

        try {
          const t1 = setTimeout(() => setExtractionProgress(50), 500);
          const t2 = setTimeout(() => setExtractionProgress(85), 1100);

          let extractedTasks = [];
          let detectedCourse = fileName.split('_')[0].split('.')[0].toUpperCase() || 'CRS101';

          try {
            const formData = new FormData();
            if (fileBlob) {
              formData.append('file', fileBlob, fileName);
            }
            formData.append('text', sourceText || '');
            formData.append('filename', fileName);

            const res = await fetch('/api/extract', {
              method: 'POST',
              body: formData
            });

            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data.tasks) && data.tasks.length > 0) {
                extractedTasks = data.tasks;
                if (data.course) detectedCourse = data.course;
              }
            }
          } catch (backendErr) {
            console.warn('Backend proxy offline, activating client heuristic engine:', backendErr);
          }

          clearTimeout(t1);
          clearTimeout(t2);

          if (extractedTasks.length === 0) {
            const textToScan = sourceText || fileName;
            const courseMatch = textToScan.match(/([A-Z]{2,4}\s?[0-9]{3})/i);
            if (courseMatch) detectedCourse = courseMatch[1].replace(/\s+/g, '').toUpperCase();

            extractedTasks = [
              { course: detectedCourse, task: 'Midterm Examination', type: 'Exam', deadline: '2026-11-15', weight: '30%', status: 'Upcoming' },
              { course: detectedCourse, task: 'Term Research Paper', type: 'Project', deadline: '2026-12-05', weight: '35%', status: 'Upcoming' },
              { course: detectedCourse, task: 'Final Comprehensive Exam', type: 'Exam', deadline: '2026-12-20', weight: '35%', status: 'Upcoming' }
            ];
          }

          const newSyllabus = {
            id: 's_' + Date.now(),
            courseCode: detectedCourse,
            courseName: detectedCourse + ' Course Document',
            term: 'Fall 2026',
            fileName: fileName,
            text: sourceText
          };

          const formattedNewTasks = extractedTasks.map((tk, idx) => ({
            id: 't_' + Date.now() + '_' + idx,
            course: tk.course || detectedCourse,
            task: tk.task || 'Deliverable ' + (idx + 1),
            type: tk.type || 'Assignment',
            deadline: tk.deadline || '2026-12-01',
            weight: tk.weight || '20%',
            status: tk.status || 'Upcoming',
            source: fileName
          }));

          setSyllabi(prev => [...prev, newSyllabus]);
          setTasks(prev => [...prev, ...formattedNewTasks]);

          setExtractionProgress(100);
          setTimeout(() => {
            setIsExtracting(false);
            setExtractionProgress(0);
            addNotification(`Extracted ${formattedNewTasks.length} deadlines from ${fileName}!`, 'success');
          }, 400);

        } catch (err) {
          setIsExtracting(false);
          setExtractionProgress(0);
          addNotification('Extraction failed: ' + err.message, 'urgent');
        }
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        files.forEach(file => {
          if (file.name.toLowerCase().endsWith('.txt')) {
            const reader = new FileReader();
            reader.onload = (event) => {
              handleAIExtraction(event.target.result || '', file.name, file);
            };
            reader.readAsText(file);
          } else {
            handleAIExtraction('', file.name, file);
          }
        });
      };

      const handleTextPasteUpload = () => {
        if (!pastedText.trim()) {
          showToast('Please enter syllabus text before uploading.', 'error');
          return;
        }
        handleAIExtraction(pastedText, 'PastedSyllabus.txt');
        setPastedText('');
      };

      const loadSampleSyllabus = () => {
        setSyllabi(DEFAULT_SYLLABI);
        setTasks(DEFAULT_TASKS);
        addNotification('Loaded 3 sample syllabus documents with 8 extracted deadlines!', 'success');
      };

      const resetAllData = () => {
        if (window.confirm("Are you sure you want to reset all data to default demo state?")) {
          setSyllabi(DEFAULT_SYLLABI);
          setTasks(DEFAULT_TASKS);
          setNotifications(DEFAULT_NOTIFICATIONS);
          setStudyHoursLogged(11.5);
          setStudentName(t.studentDefault);
          localStorage.clear();
          showToast('All data has been reset to defaults.');

      };

      // ─────────────────────────────────────────────────────────────────────────────
      // Task Management
      // ─────────────────────────────────────────────────────────────────────────────
      const deleteTask = (id) => {
        setTasks(prev => prev.filter(item => item.id !== id));
        addNotification('Task removed from syllabus schedule.', 'info');
      };

      const toggleTaskStatus = (id) => {
        setTasks(prev => prev.map(item => {
          if (item.id === id) {
            const nextStatus = item.status === 'Completed' ? 'Upcoming' : 'Completed';
            addNotification(`Task "${item.task}" marked as ${nextStatus}!`, nextStatus === 'Completed' ? 'success' : 'info');
            return { ...item, status: nextStatus };
          }
          return item;
        }));
      };

      const handleAddNewTask = (e) => {
        e.preventDefault();
        if (!newTask.course.trim() || !newTask.task.trim()) {
          showToast('Please fill in Course Code and Task Name.', 'error');
          return;
        }
        const created = {
          id: 't_user_' + Date.now(),
          course: newTask.course.trim().toUpperCase(),
          task: newTask.task.trim(),
          type: newTask.type,
          deadline: newTask.deadline || '2026-12-01',
          weight: newTask.weight || '15%',
          status: 'Upcoming',
          source: 'Manual Entry'
        };
        setTasks(prev => [...prev, created]);
        setShowAddTaskModal(false);
        setNewTask({ course: '', task: '', type: 'Assignment', deadline: '', weight: '15%' });
        addNotification(`Added custom task "${created.task}" for ${created.course}!`, 'success');
      };

      // Filtered & Sorted Tasks
      const uniqueCourses = ['All', ...new Set(tasks.map(i => i.course))];

      const filteredTasks = tasks.filter(task => {
        const matchesCourse = activeCourseFilter === 'All' || task.course === activeCourseFilter;
        const matchesSearch = searchQuery === '' || 
          task.task.toLowerCase().includes(searchQuery.toLowerCase()) ||
          task.course.toLowerCase().includes(searchQuery.toLowerCase()) ||
          task.type.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCourse && matchesSearch;
      });

      filteredTasks.sort((a, b) => {
        if (sortBy === 'soonest') return new Date(a.deadline) - new Date(b.deadline);
        if (sortBy === 'latest') return new Date(b.deadline) - new Date(a.deadline);
        if (sortBy === 'weight') return parseInt(b.weight) - parseInt(a.weight);
        if (sortBy === 'course') return a.course.localeCompare(b.course);
        return 0;
      });

      // ─────────────────────────────────────────────────────────────────────────────
      // Dashboard Specific Calculations
      // ─────────────────────────────────────────────────────────────────────────────
      const completedCount = useMemo(() => tasks.filter(t => t.status === 'Completed').length, [tasks]);
      const totalCount = tasks.length;
      const academicProgressPct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      // Nearest upcoming tasks
      const upcomingTasks = useMemo(() => {
        return tasks
          .filter(t => t.status !== 'Completed')
          .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
      }, [tasks]);

      // Upcoming exams count
      const upcomingExamsCount = useMemo(() => {
        return upcomingTasks.filter(t => t.type === 'Exam' || t.type === 'Quiz').length;
      }, [upcomingTasks]);

      // Workload intensity assessment
      const workloadStatus = useMemo(() => {
        if (upcomingExamsCount >= 2) return { text: t.workloadHeavy, level: 'high' };
        if (upcomingTasks.length >= 4) return { text: t.workloadBalanced, level: 'medium' };
        return { text: t.workloadLight, level: 'low' };
      }, [upcomingExamsCount, upcomingTasks, t]);

      // Days difference helper
      const getDaysLeft = (deadlineStr) => {
        if (!deadlineStr || deadlineStr === 'Unknown') return null;
        const target = new Date(deadlineStr);
        const today = new Date('2026-11-02'); // contextual semester date
        const diffTime = target - today;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      };

      // Workload distribution by course
      const courseWorkload = useMemo(() => {
        const counts = {};
        tasks.forEach(t => {
          counts[t.course] = (counts[t.course] || 0) + 1;
        });
        return counts;
      }, [tasks]);

      // Calendar & CSV Exporters
      const downloadICS = () => {
        if (tasks.length === 0) {
          showToast('No tasks available to export.', 'error');
          return;
        }

        let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//SyllabusPilot//University Course Planner//EN\n";

        tasks.forEach((tk, i) => {
          const cleanDate = tk.deadline ? tk.deadline.replace(/-/g, '') : '20261231';
          icsContent += "BEGIN:VEVENT\n";
          icsContent += `UID:syllabuspilot-${tk.id || i}@university.edu\n`;
          icsContent += `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z\n`;
          icsContent += `DTSTART;VALUE=DATE:${cleanDate}\n`;
          icsContent += `DTEND;VALUE=DATE:${cleanDate}\n`;
          icsContent += `SUMMARY:[${tk.course}] ${tk.task} (${tk.type})\n`;
          icsContent += `DESCRIPTION:Assessment Weight: ${tk.weight}\\nStatus: ${tk.status}\\nSource: ${tk.source || 'Syllabus'}\n`;
          icsContent += "END:VEVENT\n";
        });

                    <button
                      onClick={() => { setTimerRunning(false); setTimerSeconds(timerMode === 'focus' ? 25 * 60 : 5 * 60); }}
                      className="px-5 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl text-sm font-bold transition-all"
                    >
                      {t.resetTimer}
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* =========================================================================
              STUDENT PROFILE NAME MODAL
          ========================================================================= */}
          {showNameModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fade-in">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-extrabold text-slate-900 flex items-center gap-2">
                    <User className="w-4 h-4 text-indigo-600" />
                    <span>{t.editName}</span>
                  </h3>
                  <button onClick={() => setShowNameModal(false)} className="p-1 text-slate-400 hover:text-slate-600">
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <form onSubmit={handleSaveStudentName} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">
                      Student Name
                    </label>
                    <input
                      type="text"
                      required
                      value={nameInput}
                      onChange={(e) => setNameInput(e.target.value)}
                      placeholder="e.g. Alex Morgan"
                      className="w-full rounded-xl border border-slate-200 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 font-bold"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowNameModal(false)}
                      className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-xs active:scale-95"
                    >
                      Save Profile
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* =========================================================================
              STUDY PREFERENCES MODAL
          ========================================================================= */}
          {showPreferencesModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fade-in">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-6">
                <div className="flex items-center justify-between">
                  <h2 className="text-base sm:text-lg font-extrabold text-slate-900 flex items-center gap-2">
                    <CalendarIcon className="w-5 h-5 text-indigo-600" /> {t.modalTitle}
                  </h2>
                  <button
                    onClick={() => setShowPreferencesModal(false)}
                    className="p-2 text-slate-400 hover:text-slate-600 rounded-xl"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleReschedule} className="space-y-5">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                      {t.availableStudyHours} ({preferences.studyHoursPerWeek} hrs)
                    </label>
                    <input
                      type="range"
                      min="5"
                      max="40"
                      step="5"
                      value={preferences.studyHoursPerWeek}
                      onChange={(e) => setPreferences({ ...preferences, studyHoursPerWeek: Number(e.target.value) })}
                      className="w-full accent-indigo-600 cursor-pointer"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                      {t.unavailabilityTitle}
                    </label>
                    <select
                      value={unavailableDays}
                      onChange={(e) => setUnavailableDays(Number(e.target.value))}
                      className="w-full rounded-2xl border border-slate-200 p-3 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 bg-white"
                    >
                      <option value={0}>{t.unavail0}</option>
                      <option value={2}>{t.unavail2}</option>
                      <option value={3}>{t.unavail3}</option>
                      <option value={5}>{t.unavail5}</option>
                    </select>
                    <p className="text-[11px] text-slate-400 mt-1">{t.unavailabilityDesc}</p>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                      {t.workloadStrategy}
                    </label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'balanced', label: t.balanced },
                        { id: 'front-load', label: t.frontLoad },
                        { id: 'ease-in', label: t.easeIn },
                      ].map(b => (
                        <button
                          key={b.id}
                          type="button"
                          onClick={() => setPreferences({ ...preferences, difficultyBalance: b.id })}
                          className={`py-2 rounded-xl text-xs font-bold transition-all border ${
                            preferences.difficultyBalance === b.id
                              ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs'
                              : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                          }`}
                        >
                          {b.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                    <button
                      type="button"
                      onClick={() => setShowPreferencesModal(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-xs transition-all active:scale-95"
                    >
                      {t.savePlan}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* =========================================================================
              ADD CUSTOM TASK MODAL
          ========================================================================= */}
          {showAddTaskModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fade-in">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-5">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-extrabold text-slate-900 flex items-center gap-2">
                    <Plus className="w-5 h-5 text-indigo-600" /> {t.createNewTaskTitle}
                  </h2>
                  <button
                    onClick={() => setShowAddTaskModal(false)}
                    className="p-1.5 text-slate-400 hover:text-slate-600 rounded-xl"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleAddNewTask} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      {t.taskCourse}
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. CS101 or MATH201"
                      value={newTask.course}
                      onChange={(e) => setNewTask({ ...newTask, course: e.target.value })}
                      className="w-full rounded-xl border border-slate-200 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      {t.taskName}
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Midterm Assessment or Lab 3"
                      value={newTask.task}
                      onChange={(e) => setNewTask({ ...newTask, task: e.target.value })}
                      className="w-full rounded-xl border border-slate-200 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        {t.taskType}
                      </label>
                      <select
                        value={newTask.type}
                        onChange={(e) => setNewTask({ ...newTask, type: e.target.value })}
                        className="w-full rounded-xl border border-slate-200 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 bg-white"
                      >
                        <option value="Assignment">Assignment</option>
                        <option value="Exam">Exam</option>
                        <option value="Quiz">Quiz</option>
                        <option value="Project">Project</option>
                        <option value="Milestone">Milestone</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        {t.taskWeight}
                      </label>
                      <input
                        type="text"
                        placeholder="e.g. 20%"
                        value={newTask.weight}
                        onChange={(e) => setNewTask({ ...newTask, weight: e.target.value })}
                        className="w-full rounded-xl border border-slate-200 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      {t.taskDeadline}
                    </label>
                    <input
                      type="date"
                      value={newTask.deadline}
                      onChange={(e) => setNewTask({ ...newTask, deadline: e.target.value })}
                      className="w-full rounded-xl border border-slate-200 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                    />
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowAddTaskModal(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-xs active:scale-95"
                    >
                      {t.saveTask}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400">
            <p>{t.footer}</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
